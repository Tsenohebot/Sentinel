name: Update Conflict Zones

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-conflicts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Run conflict zone updater
        run: |
          python3 update_conflicts.py \
            --days 2 \
            --max-files 50 \
            --output conflict_zones.json

      - name: Commit and push if changed
        run: |
          git config user.name "SENTINEL Bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add -A conflict_zones.json conflict_zones.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update conflict zones — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
